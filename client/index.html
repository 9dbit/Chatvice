    <!-- Initial Loading Screen -->
    <div id="loading-screen" style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #1a1625 0%, #0f0a19 50%, #1a1625 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    ">
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        animation: fadeInUp 0.6s ease-out;
      ">
        <img 
          src="/chatvice-logo-loading.png" 
          alt="Chatvice" 
          style="
            height: 48px;
            width: auto;
            animation: pulse 2s ease-in-out infinite;
          "
        />
        
        <div style="
          width: 200px;
          height: 3px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 3px;
          overflow: hidden;
        ">
          <div id="loading-progress" style="
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #a855f7, #7c3aed);
            background-size: 200% 100%;
            border-radius: 3px;
            animation: shimmer 1.5s infinite, progress 2s ease-out forwards;
          "></div>
        </div>
      </div>
      
      <style>
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.7; }
        }
        @keyframes shimmer {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }
        @keyframes progress {
          0% { width: 0%; }
          20% { width: 25%; }
          50% { width: 60%; }
          80% { width: 85%; }
          100% { width: 100%; }
        }
      </style>
    </div>
    
    <div id="root"></div>
