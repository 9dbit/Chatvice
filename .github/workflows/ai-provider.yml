name: AI provider integration
on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/aiProviderConfig.ts'
      - 'client/src/components/admin-ai-provider*'
      - 'client/src/pages/admin/dashboard.tsx'
      - '.github/workflows/ai-provider.yml'
  push:
    branches: ['feat/qwencloud-manual-provider-20261106', 'feat/openrouter-deepseek-20261106']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run server/__tests__/ai-provider.test.ts client/src/components/admin-ai-provider.test.tsx server/__tests__/topup-token-security.test.ts
      - run: node --experimental-strip-types --test server/__tests__/postcutover-security.node.test.mjs
      - run: npm run build
